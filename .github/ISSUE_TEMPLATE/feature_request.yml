name: Feature request
description: Suggest a new capability or an improvement to pi-agy
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I checked the README to confirm this does not already exist.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like pi-agy to do? Include tool/config shapes if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Current workarounds, other tools, or designs you rejected.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, screenshots, or prior art.
